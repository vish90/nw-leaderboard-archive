<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>New World Mutated Dungeon Leaderboard Archive</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header>
    <h1>Mutated Dungeon Leaderboard Archive</h1>
    <p class="subtitle" id="subtitle">Loading…</p>
  </header>

  <div class="filters">
    <div class="field">
      <label for="dungeon-filter">Dungeon</label>
      <select id="dungeon-filter">
        <option value="">All dungeons</option>
      </select>
    </div>
    <div class="field">
      <label for="week-filter">Week</label>
      <select id="week-filter">
        <option value="">All weeks</option>
      </select>
    </div>
    <div class="field field-grow">
      <label for="player-search">Player search</label>
      <input id="player-search" type="text" placeholder="Search a player name…" />
    </div>
    <div class="field field-check">
      <label><input type="checkbox" id="resolved-only" /> Resolved players only</label>
    </div>
  </div>

  <div id="sections"></div>
</div>
<script src="app.js"></script>
</body>
</html>
